<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone - Basic Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <!-- Crosshair -->
        <div id="crosshair">+</div>
        
        <!-- HUD -->
        <div id="hud">
            <div id="health-bar">
                <span>❤️ Health: </span>
                <div class="bar-container">
                    <div id="health" class="bar"></div>
                </div>
            </div>
            <div id="position-info">Position: <span id="position">0, 0, 0</span></div>
        </div>
        
        <!-- Inventory Hotbar -->
        <div id="hotbar">
            <div class="slot selected" data-block="grass">
                <div class="block-preview grass"></div>
                <span class="slot-number">1</span>
            </div>
            <div class="slot" data-block="dirt">
                <div class="block-preview dirt"></div>
                <span class="slot-number">2</span>
            </div>
            <div class="slot" data-block="stone">
                <div class="block-preview stone"></div>
                <span class="slot-number">3</span>
            </div>
            <div class="slot" data-block="wood">
                <div class="block-preview wood"></div>
                <span class="slot-number">4</span>
            </div>
            <div class="slot" data-block="leaves">
                <div class="block-preview leaves"></div>
                <span class="slot-number">5</span>
            </div>
            <div class="slot" data-block="sand">
                <div class="block-preview sand"></div>
                <span class="slot-number">6</span>
            </div>
            <div class="slot" data-block="water">
                <div class="block-preview water"></div>
                <span class="slot-number">7</span>
            </div>
            <div class="slot" data-block="brick">
                <div class="block-preview brick"></div>
                <span class="slot-number">8</span>
            </div>
            <div class="slot" data-block="cobblestone">
                <div class="block-preview cobblestone"></div>
                <span class="slot-number">9</span>
            </div>
        </div>
        
        <!-- Instructions -->
        <div id="instructions">
            <h3>🎮 Điều khiển:</h3>
            <p><strong>Click để bắt đầu</strong></p>
            <p>WASD - Di chuyển</p>
            <p>Space - Nhảy</p>
            <p>Shift - Đi chậm</p>
            <p>Chuột - Nhìn xung quanh</p>
            <p>Click trái - Phá khối</p>
            <p>Click phải - Đặt khối</p>
            <p>1-9 - Chọn khối</p>
            <p>ESC - Thoát chuột</p>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
